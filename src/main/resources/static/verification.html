<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="AccountCreation.js" defer></script>
</head>
<body>
<div class="Page-Container">
    <div class="Nav-Bar">
        <div class="LogoBox">
            <a href="index.html" >
                <img class="logo" src="images/uk.png" alt="BTUK Logo" id="BTUKLogo">
            </a>
        </div>
        <div class="NameBox">
            <h1>Progress Map</h1>
            <a href="https://btuk.org">
                <h3 id="serverIpNavBar">BTUK.org</h3>
            </a>
        </div>
    </div>
    <div class="content-container BackgroundPage">
        <div class="AccountForm">
            <h2>Account Initiation</h2>
            <p> Log onto btuk.org on Minecraft java edition to find your one time code in chat. This will expire in 15 minutes. </p>
            <p id="errorMessage"></p>
            <p id="successMessage"></p>
            <form id="form">
                <div class="FormInput">
                    <label for="codeInput">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/></svg>
                    </label>
                    <input type="number" name="codeInput" id="codeInput" >
                </div>

                <button class="button" type="submit" id="btnSubmit">Initiate Account</button>
            </form>

            <div class="FormBottomBar">
                <button id="btnResendCode">Resend code</button>
                <a href="signUp.html">Back to signUp</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
