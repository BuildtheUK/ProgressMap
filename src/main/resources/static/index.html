<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Map</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="homePage.js" defer></script>
</head>
<body>
    <div class="Page-Container">
    <div class="Nav-Bar">
        <div class="LogoBox">
            <a href="index.html" >
            <img class="logo" src="images/uk.png" alt="BTUK Logo" id="BTUKLogo">
            </a>
        </div>
        <div class="NameBox">
                <h1>Progress Map</h1>
                <a href="https://btuk.org">
                    <h3 id="serverIpNavBar">BTUK.org</h3>
                </a>
        </div>
        <div class="ProfileBox">
                <img id="MCSkinLogo" class="logo" alt="MCSkin"  src="images/blankProfile.svg">
                <button id="btnLogin" class="loginButton">login</button>
        </div>

    </div>
    <div class="content-container"> 
        <div class="map" id="map"></div>
        <div class="sidebar">
                <div class="ItemInfoBox SidebarBox" id="NoItemSelected">
                    <p class="sidebarTitle" id="welcomeTitle">Welcome</p>
                    <p id="welcomeMessage">Have a look around or create an account to link to your Minecraft account</p>
                </div>

            <hr class="SidebarDivider" id="sidebarDivider">

                <div class="ItemInfoBox SidebarBox" id="ServerStatsBox" style="display: none;">
                    <p class="sidebarTitle">Server Statistics</p>
                </div>

                <div class="ItemInfoBox SidebarBox" id="BuildingInfoBox" style="display: none;">
                    <button class="CloseBoxBtn" id="btnCloseBuilding" title="Close">&times;</button>
                    <p class="sidebarTitle">Building Info</p>
                    <div class="StatCard">
                        <span class="StatLabel">Building Id</span>
                        <strong class="StatValue" id="buildingId">--</strong>
                    </div>
                    <div class="StatCard">
                        <span class="StatLabel">Builder</span>
                        <strong class="StatValue" id="buildingBuilder">--</strong>
                    </div>
                    <div class="StatCard">
                        <span class="StatLabel">Date built</span>
                        <strong class="StatValue" id="buildingCreatedDate">--</strong>
                    </div>
                </div>

                <div class="ItemInfoBox SidebarBox" id="RegionInfoBox" style="display: none;">
                    <button class="CloseBoxBtn" id="closeRegionBtn" title="Close">&times;</button>
                    <p class="sidebarTitle">Region Info</p>
                    <label for="RegionName"></label>
                    <input type="text" value="Name" id="RegionName">
                    <div class="ListEditBox">
                        <div class="ListDisplayBox">name1, name2, name3</div>
                        <button class="button">+</button>
                    </div>
                    <p>Area: </p>
                    <p>Number Of Buildings: </p>
                    <p>Percentage Complete: </p>
                    <p>Last Update: </p>
                    <button class="button">Edit Claim</button>
                </div>
        </div>
    </div>
    </div>
    <script>



</script>
</body>

</html>
