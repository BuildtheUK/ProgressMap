<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="AccountCreation.js" defer></script>
</head>
<body>
    <div class="Page-Container">
        <div class="Nav-Bar">
            <div class="LogoBox">
                <a href="index.html" >
                    <img class="logo" src="images/uk.png" alt="BTUK Logo" id="BTUKLogo">
                </a>
            </div>
            <div class="NameBox">
                <h1>Progress Map</h1>
                <a href="https://btuk.org">
                    <h3 id="serverIpNavBar">BTUK.org</h3>
                </a>
            </div>
        </div>
        <div class="content-container BackgroundPage" >
        <div class="AccountForm">
            <h2>Register</h2>
            <p>All accounts are linked to your Minecraft account and are verified through a message on the btuk.org server.
                Please make sure you have joined at least once before making an account.
            </p>
            <p id="errorMessage"></p>
            <form id="form">
                <div class="FormInput">
                    <label for="usernameInput">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/></svg>
                    </label>
                    <input type="text" name="McUserName" id="usernameInput" placeholder="Username">
                </div>
                <div class="FormInput">
                    <label for="passwordInput">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm296.5-223.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg>
                    </label>
                    <input class="passwordBox" type="password" name="password" id="passwordInput" placeholder="Password">
                    <button class="button showPassword" type="button" id="showPassword">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M607.5-372.5Q660-425 660-500t-52.5-127.5Q555-680 480-680t-127.5 52.5Q300-575 300-500t52.5 127.5Q405-320 480-320t127.5-52.5Zm-204-51Q372-455 372-500t31.5-76.5Q435-608 480-608t76.5 31.5Q588-545 588-500t-31.5 76.5Q525-392 480-392t-76.5-31.5ZM214-281.5Q94-363 40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200q-146 0-266-81.5Z"/></svg>
                    </button>
                </div>
                <div class="FormInput">
                    <label for="repeatPasswordInput">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm296.5-223.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg>
                    </label>
                    <input class="passwordBox" type="password" name="repeatPassword" id="repeatPasswordInput" placeholder="Repeat Password">
                    <button class="button showPassword" type="button" id="showRepeatPassword">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M607.5-372.5Q660-425 660-500t-52.5-127.5Q555-680 480-680t-127.5 52.5Q300-575 300-500t52.5 127.5Q405-320 480-320t127.5-52.5Zm-204-51Q372-455 372-500t31.5-76.5Q435-608 480-608t76.5 31.5Q588-545 588-500t-31.5 76.5Q525-392 480-392t-76.5-31.5ZM214-281.5Q94-363 40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200q-146 0-266-81.5Z"/></svg>
                    </button>
                </div>

                <button class="button" type="submit" id="btnSubmit">Request one-time-code</button>
            </form>

            <div class="FormBottomBar">
                <p>Already have an account?</p>
                <a href="login.html">login</a>
            </div>
        </div>
        </div>
    </div>
</body>
</html>
