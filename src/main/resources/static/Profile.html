<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="Profile.js" defer></script>
</head>
<body>
    <div class="Page-Container">
        <div class="Nav-Bar">
            <div class="LogoBox">
                <a href="index.html" >
                    <img class="logo" src="images/uk.png" alt="BTUK Logo" id="BTUKLogo">
                </a>
            </div>
            <div class="NameBox">
                <h1>Progress Map</h1>
                <a href="https://btuk.org">
                    <h3 id="serverIpNavBar">BTUK.org</h3>
                </a>
            </div>
        </div>
        <div class="content-container BackgroundPage">
            <div class="ProfileView AccountForm">
                <h1>Profile</h1>
                <img alt="McSkinHead" src="images/channels4_profile.jpg" id="ProfilePhoto">
                <h2>name</h2>
                <div id="ProfileStatsBox">
                    <h3>Stats</h3>
                    <p>Buildings built: </p>
                    <p>Area Claimed: </p>
                    <p>Area Complete: </p>
                    <p>Time Online: </p>
                    <p>Time afk: </p>
                </div>
                <button class="button" id="btnResetPassword">Reset Password</button>
                <button class="button DangerButton" id="btnDeleteAccount">Delete website account</button>

            </div>
        </div>
    </div>
    <div class="Popup" id="DeleteAccountPopup">
        <div class="PopupInner">
            <h2>Danger Zone!</h2>
            <p>Deleting an account cannot be undone. Do you wish to proceed?</p>
            <div id="buttonContainer">
            <button class="button DangerButton" id="btnConfirmDeleteAccount">Delete Account</button>
            <button class="button" id="btnSafety">Go Back</button>
            </div>
        </div>
    </div>
</body>
</html>
