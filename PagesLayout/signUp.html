<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Page-Container">
        <div class="Nav-Bar">
            <div class="LogoBox">
                <a href="index.html" >
                    <img class="logo" src="images/uk.png" alt="BTUK Logo" id="BTUKLogo">
                </a>
            </div>
            <div class="NameBox">
                <h1>Progress Map</h1>
                <a href="btuk.org">
                    <h3 id="serverIpNavBar">BTUK.org</h3>
                </a>
            </div>
        </div>
        <div class="content-container">
        <div class="Form">
            <h4>Register</h4>
            <p>All accounts are linked to your Minecraft account and are verified through a message on the btuk.org server.
                Please make sure you have joined at least once before making an account.
            </p>
            <p>Minecraft Username</p>
            <input type="text">

            <button>Request one-time-code</button>

            <div class="FormBottomBar">
                <p>Already have an account?</p>
                <a href="login.html">login</a>
            </div>
        </div>
        </div>
    </div>
</body>
</html>
